name: baytoti
description: "Baytouti customer Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  dartz: ^0.10.1

  go_router: ^17.1.0

  get_it: ^9.2.1

  dio: ^5.7.0
  internet_connection_checker_plus: ^2.7.2

  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

  easy_localization: ^3.0.7
  intl: ^0.20.2

  flutter_screenutil: ^5.9.3
  toastification: ^3.0.2
  rxdart: ^0.28.0

  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.0
  intl_phone_number_input: ^0.7.5

  package_info_plus: ^10.0.0
  url_launcher: ^6.3.1
  device_preview: ^1.3.1
  requests_inspector: ^5.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
